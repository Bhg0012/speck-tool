<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>History</title>
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header>
      <span class="title">History</span>
      <span id="count" class="muted"></span>
      <span class="grow"></span>
      <button id="clear" class="ghost" title="Delete all saved questions">Clear</button>
      <button id="close" class="ghost icon" title="Close (Esc)">✕</button>
    </header>
    <main id="list"></main>
    <div id="toast">Copied</div>
    <script src="history.js"></script>
  </body>
</html>
